<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="40%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Vibrant Mesh Accents -->
    <radialGradient id="glowTopLeft" cx="15%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="glowBottomRight" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.30" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="35%" stop-color="#a78bfa" />
      <stop offset="70%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(2deg); }
      }
      @keyframes shimmer {
        0% { stop-color: #60a5fa; }
        50% { stop-color: #f472b6; }
        100% { stop-color: #60a5fa; }
      }
      @keyframes badgePulse {
        0%, 100% { stroke: #38bdf8; stroke-opacity: 0.6; }
        50% { stroke: #ec4899; stroke-opacity: 1; }
      }
      .anim-glow { animation: pulseGlow 6s ease-in-out infinite alternate; transform-origin: center; }
      .anim-float-1 { animation: floatSlow 5s ease-in-out infinite; }
      .anim-float-2 { animation: floatFast 4s ease-in-out infinite; }
      .anim-card { animation: floatSlow 6s ease-in-out infinite; }
      .anim-shimmer { animation: badgePulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- Ambient Glows -->
  <circle cx="180" cy="80" r="280" fill="url(#glowTopLeft)" class="anim-glow" />
  <circle cx="1020" cy="280" r="320" fill="url(#glowBottomRight)" class="anim-glow" />

  <!-- Decorative Circuit / Node Lines -->
  <g stroke="rgba(148, 163, 184, 0.15)" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <path d="M 120 180 Q 240 120, 360 180 T 600 180" />
    <path d="M 600 180 Q 720 240, 840 180 T 1080 180" />
  </g>

  <!-- Floating Tech Badges / Icons -->
  <g class="anim-float-1">
    <!-- Booking Pill Badge Left -->
    <g transform="translate(80, 50)">
      <rect width="170" height="42" rx="21" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" opacity="0.9" />
      <circle cx="24" cy="21" r="8" fill="#22c55e" />
      <text x="42" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Real-Time Direct Sync</text>
    </g>
  </g>

  <g class="anim-float-2">
    <!-- PMS Integration Badge Right -->
    <g transform="translate(940, 48)">
      <rect width="180" height="42" rx="21" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" opacity="0.9" class="anim-shimmer" />
      <text x="24" y="26" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ CRS • PMS • Channel API</text>
    </g>
  </g>

  <!-- Center Content -->
  <!-- Category Tag -->
  <g transform="translate(450, 42)">
    <rect width="300" height="34" rx="17" fill="rgba(30, 41, 59, 0.75)" stroke="url(#textGrad)" stroke-width="1.5" />
    <text x="150" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">🏨 AWESOME ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="145" text-anchor="middle" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-0.5">
    Hotel Booking Engine
  </text>

  <!-- Subtitle -->
  <text x="600" y="186" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" letter-spacing="0.2">
    Curated Direct Booking Systems, SaaS Platforms &amp; Open-Source Hospitality Architecture
  </text>

  <!-- Interactive Feature Highlights (Cards) -->
  <g transform="translate(180, 230)" class="anim-card">
    <!-- Card 1: Direct Reservations -->
    <g transform="translate(0, 0)">
      <rect width="250" height="80" rx="12" fill="url(#cardGrad)" stroke="rgba(96, 165, 250, 0.3)" stroke-width="1" />
      <text x="20" y="34" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">🛎️ Direct Booking Engine</text>
      <text x="20" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Zero-Commission &amp; Conversions</text>
    </g>

    <!-- Card 2: Open Source Stack -->
    <g transform="translate(295, 0)">
      <rect width="250" height="80" rx="12" fill="url(#cardGrad)" stroke="rgba(167, 139, 250, 0.3)" stroke-width="1" />
      <text x="20" y="34" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">🔓 Open-Source Solutions</text>
      <text x="20" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">QloApps, ERPNext, Odoo, Custom</text>
    </g>

    <!-- Card 3: Rates & Distribution -->
    <g transform="translate(590, 0)">
      <rect width="250" height="80" rx="12" fill="url(#cardGrad)" stroke="rgba(244, 114, 182, 0.3)" stroke-width="1" />
      <text x="20" y="34" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">📊 Rates &amp; Distribution</text>
      <text x="20" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Real-Time Inventory &amp; Dynamic Pricing</text>
    </g>
  </g>

  <!-- Subtle Bottom Accent Line -->
  <rect x="300" y="348" width="600" height="3" rx="1.5" fill="url(#textGrad)" opacity="0.8" />
</svg>
